name: webdev-pj1

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    init: true
    network_mode: host
    working_dir: /workspace
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
    environment:
      DB_HOST: 127.0.0.1
      DB_PORT: ${DB_PORT:-3307}
      DB_NAME: ${MYSQL_DATABASE:-webdev}
      DB_USER: ${MYSQL_USER:-webdev}
      DB_PASSWORD: ${MYSQL_PASSWORD:-local_dev_password}
      API_PORT: ${API_PORT:-3000}
      FRONTEND_PORT: ${FRONTEND_PORT:-5173}
      WEB_HOST: ${WEB_HOST:-127.0.0.1}
      TMPDIR: /workspace/tmp
      npm_config_cache: /workspace/tmp/npm-cache
      PLAYWRIGHT_BROWSERS_PATH: /workspace/tmp/playwright
    command: ["sh", "docker/start-dev.sh"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "docker/healthcheck.mjs"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 6

  db:
    image: public.ecr.aws/docker/library/mysql:8.4
    network_mode: host
    command: ["mysqld", "--port=${DB_PORT:-3307}", "--bind-address=127.0.0.1", "--mysqlx=OFF"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-webdev}
      MYSQL_USER: ${MYSQL_USER:-webdev}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_root_password}
      DB_PORT: ${DB_PORT:-3307}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h127.0.0.1 -P$$DB_PORT -u$$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 20

volumes:
  node_modules:
  mysql_data:
